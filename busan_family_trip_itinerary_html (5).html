<body>
<main class="container">
<section class="hero"><div class="tag">🇰🇷 Busan Family Trip</div><h1>釜山5天4夜<br>家庭旅遊＋預算記帳</h1><p>8/7–8/12｜行程、地圖、家庭友善標籤、即時花費記帳整合版</p></section>
<nav class="nav"><a href="#budget">預算</a><a href="#addExpense">新增花費</a><a href="#addTrip">新增行程</a><a href="#day0">Day0</a><a href="#day1">Day1</a><a href="#day2">Day2</a><a href="#day3">Day3</a><a href="#day4">Day4</a><a href="#day5">Day5</a></nav>

<section class="card" id="budget">
<h2>💰 旅遊預算總覽</h2><p class="muted">可設定總預算，也可以旅途中一筆一筆新增實際花費。</p>
<div class="grid" style="margin-top:12px">
<div class="field"><label>人數</label><input id="people" type="number" value="1" min="1"></div>
<div class="field"><label>匯率：1 KRW ≈ NTD</label><input id="rate" type="number" value="0.025" step="0.001"></div>
<div class="field"><label>住宿預算 NTD</label><input class="budgetInput" id="hotelBudget" type="number" value="0"></div>
<div class="field"><label>餐飲預算 NTD</label><input class="budgetInput" id="foodBudget" type="number" value="0"></div>
<div class="field"><label>交通預算 NTD</label><input class="budgetInput" id="transportBudget" type="number" value="0"></div>
<div class="field"><label>門票預算 NTD</label><input class="budgetInput" id="ticketBudget" type="number" value="0"></div>
<div class="field"><label>購物預算 NTD</label><input class="budgetInput" id="shoppingBudget" type="number" value="0"></div>
</div>
<div class="budget-summary">
<div class="summary-box">總預算<br><b id="totalBudget">0</b> NTD<br><span class="muted" id="totalBudgetKrw">0 KRW</span></div>
<div class="summary-box">實際花費<br><b id="actualTotal">0</b> NTD<br><span class="muted" id="actualTotalKrw">0 KRW</span></div>
<div class="summary-box">剩餘預算<br><b id="remaining">0</b> NTD<br><span class="muted" id="remainingKrw">0 KRW</span></div>
<div class="summary-box">平均每人<br><b id="perPerson">0</b> NTD<br><span class="muted" id="perPersonKrw">0 KRW</span></div>
<div class="summary-box">目前匯率<br><b>1 KRW</b><br><span class="muted">≈ NTD <span id="rateText">0.025</span></span></div>
</div>
</section>

<section class="card" id="addExpense">
<h2>🧾 旅途中新增花費</h2>
<div class="grid" style="margin-top:12px">
<div class="field"><label>日期</label><select id="expenseDay"><option value="day0">Day0</option><option value="day1">Day1</option><option value="day2">Day2</option><option value="day3">Day3</option><option value="day4">Day4</option><option value="day5">Day5</option></select></div>
<div class="field"><label>分類</label><select id="expenseCategory"><option>餐飲</option><option>交通</option><option>門票</option><option>購物</option><option>住宿</option><option>其他</option></select></div>
<div class="field"><label>項目</label><input id="expenseName" placeholder="例：咖啡、計程車、門票"></div>
<div class="field"><label>幣別</label><select id="expenseCurrency"><option value="KRW">韓元 KRW</option><option value="NTD">台幣 NTD</option></select></div>
<div class="field"><label>金額</label><input id="expenseAmount" type="number" placeholder="可輸入韓元或台幣"></div>
</div>
<div class="actions"><button class="btn primary" onclick="addExpense()">➕ 新增花費</button><button class="btn red" onclick="resetExpenses()">清空花費</button></div>
<div id="dailySummary" class="budget-summary"></div>
<div id="expenseList"></div>
</section>

<h2 class="section-title">每日行程</h2>
<section id="timeline"></section>

<section class="card" id="addTrip">
<h2>＋ 新增行程卡片</h2>
<div class="grid" style="margin-top:12px">
<div class="field"><label>Day</label><select id="tripDay"><option value="day0">Day0</option><option value="day1">Day1</option><option value="day2">Day2</option><option value="day3">Day3</option><option value="day4">Day4</option><option value="day5">Day5</option></select></div>
<div class="field"><label>Icon</label><input id="tripIcon" value="📍"></div>
<div class="field"><label>時間</label><input id="tripTime" placeholder="例：21:00"></div>
<div class="field"><label>景點 / 餐廳</label><input id="tripPlace" placeholder="例：松亭三代豬肉湯飯"></div>
<div class="field"><label>地圖搜尋關鍵字</label><input id="tripQuery" placeholder="不填則用景點名稱"></div>
<div class="field"><label>家庭標籤</label><select id="tripBadge"><option value="easy">👶 長輩OK</option><option value="walk">🚶‍♂️ 需走路</option><option value="reserve">📌 需預約</option></select></div>
</div>
<div class="field" style="margin-top:10px"><label>描述</label><textarea id="tripDesc" rows="2" style="width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:9px"></textarea></div>
<div class="actions"><button class="btn primary" onclick="addTripItem()">新增行程</button><button class="btn blue" onclick="exportHTML()">匯出目前 HTML</button><button class="btn red" onclick="resetAll()">恢復原始版本</button></div>
</section>
<div class="app-spacer"></div>
</main>

<button class="fab" onclick="openSheet('expense')">＋</button>
<div class="bottom-bar">
  <a href="#budget">💰<br>預算</a>
  <a href="#timeline">📅<br>行程</a>
  <button onclick="openSheet('expense')">🧾<br>花費</button>
  <button onclick="openSheet('trip')">＋<br>新增</button>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
<section class="sheet" id="appSheet">
  <div class="sheet-handle"></div>
  <div class="quick-actions">
    <button id="expenseTab" onclick="switchSheet('expense')">🧾 新增花費</button>
    <button id="tripTab" onclick="switchSheet('trip')">📍 新增行程</button>
  </div>

  <div class="sheet-section" id="expenseSheet">
    <h2>快速新增花費</h2>
    <div class="grid" style="margin-top:12px">
      <div class="field"><label>日期</label><select id="mExpenseDay"><option value="day0">Day0</option><option value="day1">Day1</option><option value="day2">Day2</option><option value="day3">Day3</option><option value="day4">Day4</option><option value="day5">Day5</option></select></div>
      <div class="field"><label>分類</label><select id="mExpenseCategory"><option>餐飲</option><option>交通</option><option>門票</option><option>購物</option><option>住宿</option><option>其他</option></select></div>
      <div class="field"><label>項目</label><input id="mExpenseName" placeholder="例：咖啡、計程車"></div>
      <div class="field"><label>幣別</label><select id="mExpenseCurrency"><option value="KRW">韓元 KRW</option><option value="NTD">台幣 NTD</option></select></div>
      <div class="field"><label>金額</label><input id="mExpenseAmount" type="number" placeholder="輸入金額"></div>
    </div>
    <div class="actions"><button class="btn primary" onclick="addMobileExpense()">新增花費</button><button class="btn blue" onclick="closeSheet()">關閉</button></div>
  </div>

  <div class="sheet-section" id="tripSheet">
    <h2>快速新增行程</h2>
    <div class="grid" style="margin-top:12px">
      <div class="field"><label>Day</label><select id="mTripDay"><option value="day0">Day0</option><option value="day1">Day1</option><option value="day2">Day2</option><option value="day3">Day3</option><option value="day4">Day4</option><option value="day5">Day5</option></select></div>
      <div class="field"><label>Icon</label><input id="mTripIcon" value="📍"></div>
      <div class="field"><label>時間</label><input id="mTripTime" placeholder="例：21:00"></div>
      <div class="field"><label>景點 / 餐廳</label><input id="mTripPlace" placeholder="例：咖啡廳"></div>
      <div class="field"><label>地圖關鍵字</label><input id="mTripQuery" placeholder="不填則用景點名稱"></div>
      <div class="field"><label>家庭標籤</label><select id="mTripBadge"><option value="easy">👶 長輩OK</option><option value="walk">🚶‍♂️ 需走路</option><option value="reserve">📌 需預約</option></select></div>
    </div>
    <div class="field" style="margin-top:10px"><label>描述</label><textarea id="mTripDesc" rows="2"></textarea></div>
    <div class="actions"><button class="btn primary" onclick="addMobileTripItem()">新增行程</button><button class="btn blue" onclick="closeSheet()">關閉</button></div>
  </div>
</section>

<script>
const DAY_INFO={day0:['Day0｜8/7 抵達釜山・入住西面','8/7'],day1:['Day1｜8/8 南浦＋廣安里無人機＋遊艇','8/8'],day2:['Day2｜8/9 慶州一日遊','8/9'],day3:['Day3｜8/10 甘川洞＋THE SKY＋換飯店','8/10'],day4:['Day4｜8/11 海雲台＋膠囊列車','8/11'],day5:['Day5｜8/12 回程','8/12']};
const BASE_ITEMS=[
{day:'day0',icon:'✈️',time:'19:00',place:'金海機場抵達',desc:'抵達後直接前往西面飯店。',badge:'easy',query:'Gimhae International Airport'},
{day:'day0',icon:'🏨',time:'20:00',place:'西面阿班飯店 Check-in',desc:'入住西面商圈。',badge:'easy',query:'Arban Hotel Busan'},
{day:'day0',icon:'🍜',time:'21:00',place:'松亭三代豬肉湯飯',desc:'抵達後第一餐，適合熱湯宵夜。',badge:'easy',query:'Songjeong 3dae Gukbap Busan'},
{day:'day1',icon:'☕',time:'09:30–10:30',place:'ALL SUNDAY 西面早餐',desc:'早餐後從西面出發去南浦。',badge:'easy',query:'ALL SUNDAY Seomyeon Busan'},
{day:'day1',icon:'🛍️',time:'11:00–15:30',place:'南浦洞｜BIFF、札嘎其市場、國際市場',desc:'小吃、襪子、棉被一條街，會走比較多路。',badge:'walk',query:'BIFF Square Jagalchi Market Gukje Market Busan'},
{day:'day1',icon:'☕',time:'15:30–16:30',place:'Ryui’s Coffee Bar / Cafe Nampo Yunseul',desc:'中午後休息補體力。',badge:'easy',query:'Ryui Coffee Bar Busan'},
{day:'day1',icon:'🏖️',time:'17:00',place:'廣安里海灘＋炸雞晚餐',desc:'海邊散步、拍照、晚餐。',badge:'easy',query:'Gwangalli Beach Busan'},
{day:'day1',icon:'⛵',time:'19:30–20:30',place:'Yachtholic 遊艇＋無人機＋煙火',desc:'需提早 20 分鐘集合。',badge:'reserve',query:'Yachtholic Busan'},
{day:'day1',icon:'🚕',time:'21:00',place:'返回西面',desc:'遊艇結束後回西面。',badge:'easy',query:'Seomyeon Busan'},
{day:'day1',icon:'🍜',time:'宵夜',place:'松亭三代豬肉湯飯',desc:'Day1 宵夜安排。',badge:'easy',query:'Songjeong 3dae Gukbap Busan'},
{day:'day2',icon:'🏛️',time:'整天',place:'KLOOK / KKDAY 慶州一日遊',desc:'比較接送點、景點內容與回程時間。',badge:'reserve',query:'Gyeongju Korea'},
{day:'day2',icon:'🍽️',time:'晚餐',place:'Old Mansion',desc:'慶州回來後晚餐。',badge:'easy',query:'Old Mansion Busan'},

{day:'day3',icon:'🍜',time:'12:00–13:30',place:'海雲台元祖老奶奶湯飯',desc:'抵達海雲台後午餐。',badge:'easy',query:'Haeundae Wonjo Halmae Gukbap'},
{day:'day3',icon:'🎡',time:'14:00–18:00',place:'LUGE / 新世界免稅店 / Spa Land / Centum City',desc:'可分組，不玩 LUGE 的家人可逛百貨或休息。',badge:'reserve',query:'Skyline Luge Busan Centum City'},
{day:'day3',icon:'🌃',time:'19:30–20:30',place:'BUSAN X THE SKY 夜景',desc:'海雲台高空夜景。',badge:'easy',query:'Busan X The Sky'},
{day:'day3',icon:'🏨',time:'晚上',place:'入住 Hotel Hyggelig Busan',desc:'換到海雲台住宿。',badge:'easy',query:'Hotel Hyggelig Busan'},

{day:'day4',icon:'🥐',time:'膠囊列車前',place:'自然島鹽麵包',desc:'尾浦站入口處對面，建議 Naver 預訂。',badge:'reserve',query:'Jayeondo Salt Bread Mipo Busan'},
{day:'day4',icon:'🚆',time:'16:30–17:00',place:'膠囊列車 → 青沙浦天空步道',desc:'8/4 早上 8 點預約，時間可能往前移。',badge:'reserve',query:'Haeundae Blue Line Park Mipo Station'},
{day:'day4',icon:'🥩',time:'晚餐',place:'海雲台母牛肋排家',desc:'建議 CatchTable 預約。',badge:'reserve',query:'Haeundae sogalbi Busan'},
{day:'day5',icon:'🥣',time:'09:00',place:'大海鮑魚粥',desc:'回程前早餐。',badge:'easy',query:'Haeundae abalone porridge Busan'},
{day:'day5',icon:'✈️',time:'11:00',place:'前往金海機場',desc:'預留交通、退稅、托運與安檢時間。',badge:'easy',query:'Gimhae International Airport'}].map((x,i)=>({...x,id:'base-'+i}));
let items=JSON.parse(localStorage.getItem('busan_items_v4')||'null')||BASE_ITEMS;
let expenses=JSON.parse(localStorage.getItem('busan_expenses_v4')||'[]');
function save(){localStorage.setItem('busan_items_v4',JSON.stringify(items));localStorage.setItem('busan_expenses_v4',JSON.stringify(expenses));}
function yen(n){return (Math.round(n)||0).toLocaleString();}
function badgeText(b){return b==='walk'?'🚶‍♂️ 需走路':b==='reserve'?'📌 需預約':'👶 長輩OK'}
function badgeClass(b){return b==='walk'?'walk':b==='reserve'?'reserve':'easy'}
function mapUrl(q,type){q=encodeURIComponent(q||'Busan');return type==='naver'?`https://map.naver.com/p/search/${q}`:`https://www.google.com/maps/search/?api=1&query=${q}`}
function renderTimeline(){const root=document.getElementById('timeline');root.innerHTML='';Object.entries(DAY_INFO).forEach(([day,[title,date]])=>{const card=document.createElement('article');card.className='day-card';card.id=day;card.innerHTML=`<div class="day-head"><h2>${title}</h2><span class="date">${date}</span></div><div class="spots"></div>`;const spots=card.querySelector('.spots');items.filter(x=>x.day===day).forEach(item=>{const el=document.createElement('div');el.className='spot';el.innerHTML=`<button class="delete" onclick="deleteTrip('${item.id}')">×</button><div class="icon">${item.icon}</div><div><div class="time">${item.time}</div><div class="place">${item.place}</div><p class="muted">${item.desc}</p><div class="badge-row"><span class="badge ${badgeClass(item.badge)}">${badgeText(item.badge)}</span></div><div class="map"><a target="_blank" href="${mapUrl(item.query||item.place,'google')}">Google Maps</a><a target="_blank" href="${mapUrl(item.query||item.place,'naver')}">Naver</a></div></div>`;spots.appendChild(el)});root.appendChild(card)});}
function deleteTrip(id){if(confirm('確定刪除此行程？')){items=items.filter(x=>x.id!==id);save();renderTimeline();}}
function addTripItem(){const place=tripPlace.value.trim();if(!place)return alert('請輸入景點 / 餐廳');items.push({id:'custom-'+Date.now(),day:tripDay.value,icon:tripIcon.value||'📍',time:tripTime.value||'',place,desc:tripDesc.value||'',badge:tripBadge.value,query:tripQuery.value||place});save();renderTimeline();tripPlace.value='';tripDesc.value='';tripTime.value='';tripQuery.value='';tripIcon.value='📍';document.getElementById(tripDay.value).scrollIntoView({behavior:'smooth'});}
function toKrw(ntd){const rate=+document.getElementById('rate').value||0.025;return ntd/rate;}
function toNtd(krw){const rate=+document.getElementById('rate').value||0.025;return krw*rate;}
function calcBudget(){const ids=['hotelBudget','foodBudget','transportBudget','ticketBudget','shoppingBudget'];const total=ids.reduce((s,id)=>s+(+document.getElementById(id).value||0),0);const actual=expenses.reduce((s,e)=>s+e.ntd,0);const people=+document.getElementById('people').value||1;const remainingNtd=total-actual;const perNtd=actual/people;totalBudget.innerText=yen(total);totalBudgetKrw.innerText=yen(toKrw(total))+' KRW';actualTotal.innerText=yen(actual);actualTotalKrw.innerText=yen(toKrw(actual))+' KRW';remaining.innerText=yen(remainingNtd);remainingKrw.innerText=yen(toKrw(remainingNtd))+' KRW';perPerson.innerText=yen(perNtd);perPersonKrw.innerText=yen(toKrw(perNtd))+' KRW';rateText.innerText=(+document.getElementById('rate').value||0.025);renderDailySummary();}
function addExpense(){const name=expenseName.value.trim();const amount=+expenseAmount.value||0;const currency=expenseCurrency.value;if(!name||!amount)return alert('請填完整花費');const ntd=currency==='KRW'?toNtd(amount):amount;const krw=currency==='KRW'?amount:toKrw(amount);expenses.push({id:'e-'+Date.now(),day:expenseDay.value,category:expenseCategory.value,name,currency,originalAmount:amount,ntd,krw});expenseName.value='';expenseAmount.value='';save();renderExpenses();calcBudget();}
function deleteExpense(id){expenses=expenses.filter(e=>e.id!==id);save();renderExpenses();calcBudget();}
function normalizeExpense(e){if(e.ntd!==undefined&&e.krw!==undefined)return e;const ntd=e.amount||0;return {...e,ntd,krw:toKrw(ntd),currency:'NTD',originalAmount:ntd};}
function renderExpenses(){expenses=expenses.map(normalizeExpense);expenseList.innerHTML='';expenses.slice().reverse().forEach(e=>{const row=document.createElement('div');row.className='expense-row';row.innerHTML=`<div><b>${DAY_INFO[e.day][0].split('｜')[0]}｜${e.category}</b><br><span class="muted">${e.name}｜原始輸入：${yen(e.originalAmount)} ${e.currency}</span></div><div><b>${yen(e.ntd)} NTD</b><br><span class="muted">≈ ${yen(e.krw)} KRW</span><br><button class="btn red" onclick="deleteExpense('${e.id}')">刪除</button></div>`;expenseList.appendChild(row)});save();}
function renderDailySummary(){dailySummary.innerHTML='';Object.keys(DAY_INFO).forEach(day=>{const sum=expenses.filter(e=>e.day===day).reduce((s,e)=>s+(e.ntd||0),0);const box=document.createElement('div');box.className='summary-box';box.innerHTML=`${DAY_INFO[day][0].split('｜')[0]}<br><b>${yen(sum)}</b> NTD<br><span class="muted">≈ ${yen(toKrw(sum))} KRW</span>`;dailySummary.appendChild(box)});}
function resetExpenses(){if(confirm('確定清空所有花費？')){expenses=[];save();renderExpenses();calcBudget();}}
function resetAll(){if(confirm('確定恢復原始行程並清空花費？')){items=BASE_ITEMS;expenses=[];save();function openSheet(type='expense'){sheetBackdrop.classList.add('show');appSheet.classList.add('show');switchSheet(type)}
function closeSheet(){sheetBackdrop.classList.remove('show');appSheet.classList.remove('show')}
function switchSheet(type){expenseTab.classList.toggle('active',type==='expense');tripTab.classList.toggle('active',type==='trip');expenseSheet.classList.toggle('active',type==='expense');tripSheet.classList.toggle('active',type==='trip')}
function addMobileExpense(){const name=mExpenseName.value.trim();const amount=+mExpenseAmount.value||0;const currency=mExpenseCurrency.value;if(!name||!amount)return alert('請填完整花費');const ntd=currency==='KRW'?toNtd(amount):amount;const krw=currency==='KRW'?amount:toKrw(amount);expenses.push({id:'e-'+Date.now(),day:mExpenseDay.value,category:mExpenseCategory.value,name,currency,originalAmount:amount,ntd,krw});mExpenseName.value='';mExpenseAmount.value='';save();renderExpenses();calcBudget();closeSheet();document.getElementById('addExpense').scrollIntoView({behavior:'smooth'})}
function addMobileTripItem(){const place=mTripPlace.value.trim();if(!place)return alert('請輸入景點 / 餐廳');items.push({id:'custom-'+Date.now(),day:mTripDay.value,icon:mTripIcon.value||'📍',time:mTripTime.value||'',place,desc:mTripDesc.value||'',badge:mTripBadge.value,query:mTripQuery.value||place});save();renderTimeline();const target=mTripDay.value;mTripPlace.value='';mTripDesc.value='';mTripTime.value='';mTripQuery.value='';mTripIcon.value='📍';closeSheet();document.getElementById(target).scrollIntoView({behavior:'smooth'})}
renderTimeline();renderExpenses();calcBudget();}}
function exportHTML(){const blob=new Blob([document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='busan-family-trip-budget.html';a.click();URL.revokeObjectURL(a.href);}
document.querySelectorAll('.budgetInput,#people,#rate').forEach(el=>el.addEventListener('input',calcBudget));
renderTimeline();renderExpenses();calcBudget();
</script>
</body>
</html>
